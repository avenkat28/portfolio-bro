spring:
  application:
    name: portfolio-bro
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfoliobro}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
server:
  address: 127.0.0.1
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
